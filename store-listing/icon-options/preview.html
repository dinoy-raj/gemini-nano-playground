<!doctype html><html><head><style>
  body { margin: 0; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
  .row { display: flex; justify-content: center; gap: 120px; padding: 70px 80px 40px; }
  .light { background: #FFFFFF; color: #1F1F1F; }
  .dark { background: #000000; color: #E3E3E3; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .cell img.big { width: 200px; height: 200px; }
  .launch { display: flex; gap: 22px; align-items: center; }
  .launch div { width: 72px; height: 72px; display: grid; place-items: center; overflow: hidden; }
  .launch img { width: 72px; height: 72px; transform: scale(1.12); }
  .light .launch div { background: #F8F9FF; }
  .dark .launch div { background: #1B1C22; }
  .circle { border-radius: 50%; } .squircle { border-radius: 30%; }
  .label { font-size: 22px; font-weight: 500; }
</style></head><body>
<div class="row light">
  <div class="cell">
    <img class="big" src="option-1-prompt-bubble.svg">
    <div class="launch"><div class="circle"><img src="option-1-prompt-bubble.svg"></div><div class="squircle"><img src="option-1-prompt-bubble.svg"></div></div>
    <div class="label">Prompt Bubble</div>
  </div>
  <div class="cell">
    <img class="big" src="option-2-pocket-spark.svg">
    <div class="launch"><div class="circle"><img src="option-2-pocket-spark.svg"></div><div class="squircle"><img src="option-2-pocket-spark.svg"></div></div>
    <div class="label">Pocket Spark</div>
  </div>
  <div class="cell">
    <img class="big" src="option-3-nano-chip.svg">
    <div class="launch"><div class="circle"><img src="option-3-nano-chip.svg"></div><div class="squircle"><img src="option-3-nano-chip.svg"></div></div>
    <div class="label">Nano Chip</div>
  </div></div><div class="row dark">
  <div class="cell">
    <img class="big" src="option-1-prompt-bubble.svg">
    <div class="launch"><div class="circle"><img src="option-1-prompt-bubble.svg"></div><div class="squircle"><img src="option-1-prompt-bubble.svg"></div></div>
    
  </div>
  <div class="cell">
    <img class="big" src="option-2-pocket-spark.svg">
    <div class="launch"><div class="circle"><img src="option-2-pocket-spark.svg"></div><div class="squircle"><img src="option-2-pocket-spark.svg"></div></div>
    
  </div>
  <div class="cell">
    <img class="big" src="option-3-nano-chip.svg">
    <div class="launch"><div class="circle"><img src="option-3-nano-chip.svg"></div><div class="squircle"><img src="option-3-nano-chip.svg"></div></div>
    
  </div></div>
</body></html>
