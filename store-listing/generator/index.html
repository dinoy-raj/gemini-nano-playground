<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nano Prompt Ground store assets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
  :root {
    --ink: #16133D;
    --ink2: #4A4870;
    --brand1: #4F6BFF;
    --brand2: #8B5CF6;
    --brand3: #D16BD8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F6FF; font-family: 'Google Sans Flex', sans-serif; -webkit-font-smoothing: antialiased; }
  .ms { font-family: 'Material Symbols Rounded'; font-variation-settings: 'FILL' 1, 'wght' 500, 'opsz' 24; line-height: 1; display: inline-block; font-style: normal; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .box { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .shape { position: absolute; inset: 0; width: 100%; height: 100%; }
  .box > .ms { position: relative; }
  .app { position: relative; display: flex; flex-direction: column; overflow: hidden; font-family: 'Google Sans Flex', sans-serif; }
  .sb { display: flex; align-items: center; justify-content: space-between; color: #E6E0E9; flex-shrink: 0; position: relative; }
  .nav { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav i { display: block; background: #E6E0E9; border-radius: 99px; }
  .md p { margin-bottom: calc(var(--dp) * 12); }
  .md ul { padding-left: calc(var(--dp) * 22); margin-bottom: calc(var(--dp) * 12); }
  .md li { margin-bottom: calc(var(--dp) * 6); }
  .md strong { font-weight: 700; }
  .stats { display: flex; flex-wrap: wrap; }
  .caret { display: inline-block; vertical-align: text-bottom; margin-left: 2px; border-radius: 2px; }

  /* ------------------------------------------------ marketing canvas */
  /* Expressive store style: a bold colour field per frame, oversized white type with a pill
     highlight, a big device bleeding off the edge and the icon's tilted back card behind it. */
  #strip { position: relative; overflow: hidden; }
  .frame { position: absolute; top: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .slab { position: absolute; background: rgba(255, 255, 255, .13); }
  .spark { position: absolute; }
  .tag { display: inline-flex; align-items: center; gap: .5em; padding: .4em 1.05em .4em .45em; border-radius: 99px;
         background: rgba(255, 255, 255, .18); border: 2px solid rgba(255, 255, 255, .38); color: #fff; font-weight: 650; letter-spacing: .01em; }
  .tag img { width: 1.6em; height: 1.6em; border-radius: 30%; background: #F8F9FF; }
  .title { color: #fff; font-weight: 820; letter-spacing: -0.03em; line-height: 1.04; text-wrap: balance; }
  .title em { font-style: normal; background: #fff; color: var(--ink); border-radius: .26em; padding: 0 .16em; white-space: nowrap;
              -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sub { color: rgba(255, 255, 255, .88); font-weight: 450; line-height: 1.3; letter-spacing: -0.005em; }
  .device { position: absolute; background: #0C0B11; box-shadow: 0 0 0 3px rgba(255, 255, 255, .22), 0 70px 140px -20px rgba(8, 20, 40, .55), 0 20px 40px rgba(8, 20, 40, .25); }
  .device .cam { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; background: #000; z-index: 3; box-shadow: inset 0 0 0 2px #1d1c28; }
  .backcard { position: absolute; border-radius: 9%/6%; background: linear-gradient(135deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .12)); }
  .chip { position: relative; display: inline-flex; align-items: center; background: #fff; color: #10172A; font-weight: 680; white-space: nowrap;
          box-shadow: 0 28px 60px -12px rgba(8, 20, 40, .4), 0 4px 12px rgba(8, 20, 40, .1); z-index: 10; letter-spacing: -0.01em; }
  .chip .ic { display: flex; align-items: center; justify-content: center; border-radius: 30%; color: #fff;
              background: linear-gradient(135deg, var(--a), var(--b)); flex-shrink: 0; }
  .card { position: relative; z-index: 10; box-shadow: 0 30px 80px -10px rgba(8, 20, 40, .55); }
  .win { position: absolute; background: #1D1B22; box-shadow: 0 0 0 2px rgba(255, 255, 255, .22), 0 70px 140px -20px rgba(8, 20, 40, .55); overflow: hidden; }
  .win .bar { display: flex; align-items: center; background: #26242C; color: #E6E0E9; }
</style>
</head>
<body>
<div id="strip"></div>
<script src="ui.js"></script>
<script src="scenes.js"></script>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'phone';
const LAUNCHER = '../../app/src/main/ic_launcher-playstore.png';
const ICON_ART = '../icon/icon.svg';

// One colour field per frame, taken from the app icon: green window, blue card, yellow glow,
// plus neighbouring hues. a/b = gradient, glow = soft bloom, ink = highlight text colour.
const THEMES = [
  { a: '#22CE82', b: '#0A8C5A', glow: '#FDE047', ink: '#0A7A4E' },
  { a: '#4C8DFF', b: '#1E55DC', glow: '#FF8FC8', ink: '#1D4ED8' },
  { a: '#8F6EFF', b: '#5634E0', glow: '#5EE7F5', ink: '#4C2FD1' },
  { a: '#FF9D42', b: '#F0522B', glow: '#FFE066', ink: '#D9461C' },
  { a: '#1CC4B1', b: '#0A7487', glow: '#C6F36B', ink: '#0A6878' },
  { a: '#2B3A78', b: '#0D1433', glow: '#34D399', ink: '#1E2A5A' },
  { a: '#FF6B9B', b: '#DB2D69', glow: '#FFC46B', ink: '#C21D58' },
  { a: '#20C47A', b: '#1E63DA', glow: '#FDE047', ink: '#0E7A50' },
];
const theme = (i) => THEMES[i % THEMES.length];
const vars = (t) => `--a:${t.a};--b:${t.b};--ink:${t.ink}`;

const sparkSvg = (opacity = 1) => `<svg viewBox="0 0 100 100" width="100%" height="100%" style="opacity:${opacity}">
  <path d="${SHAPES.sparkle4}" fill="#fff"/></svg>`;

// Colour fields side by side, with glows and translucent back cards crossing the seams so the
// set still reads as one panorama in the store.
function background(W, H, n) {
  const big = Math.max(W, H), wide = W > H;
  let html = `<div class="bg" style="width:${W * n}px;height:${H}px">`;
  for (let i = 0; i < n; i++) {
    const t = theme(i);
    html += `<div style="position:absolute;left:${i * W}px;top:0;width:${W + 2}px;height:${H}px;background:linear-gradient(${wide ? 120 : 165}deg,${t.a},${t.b})"></div>`;
  }
  for (let i = 0; i < n; i++) {
    const t = theme(i), s = big * 0.55;
    const x = i * W + (wide ? 0.62 : 0.15) * W - s / 2, y = (wide ? 0.85 : 0.88) * H - s / 2;
    html += `<div class="blob" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${t.glow};opacity:.55"></div>`;
  }
  for (let i = 1; i < n; i++) {
    const w = (wide ? 0.34 : 0.62) * W, h = (wide ? 0.62 : 0.3) * H;
    const y = (wide ? (i % 2 ? 0.62 : -0.18) : (i % 2 ? 0.08 : 0.7)) * H;
    html += `<div class="slab" style="left:${i * W - w / 2}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${Math.min(w, h) * 0.22}px;transform:rotate(${i % 2 ? 8 : -8}deg)"></div>`;
    const sp = 0.08 * Math.min(W, H) * (wide ? 1.4 : 1);
    html += `<div class="spark" style="left:${i * W - sp / 2}px;top:${(wide ? (i % 2 ? 0.12 : 0.8) : (i % 2 ? 0.62 : 0.36)) * H}px;width:${sp}px;height:${sp}px">${sparkSvg(.85)}</div>`;
  }
  return html + '</div>';
}

function chip(c, fs) {
  const f = c.small ? fs * 0.86 : fs;
  return `<div class="chip" style="font-size:${f}px;gap:${f * 0.5}px;padding:${f * 0.42}px ${f * 0.9}px ${f * 0.42}px ${f * 0.42}px;border-radius:${f * 0.75}px">
    <span class="ic" style="width:${f * 1.75}px;height:${f * 1.75}px"><span class="ms" style="font-size:${f * 1.02}px">${c.icon}</span></span>${c.text}</div>`;
}

function statsCard(sc, fs) {
  const cells = sc.values.map(([v, u, l]) => `<div class="col" style="align-items:flex-start;gap:${fs * 0.2}px">
      <div style="color:var(--ink);font-size:${fs * 1.9}px;font-weight:780;letter-spacing:-0.03em;line-height:1">${v}<span style="font-size:${fs * 0.9}px;font-weight:600;margin-left:4px">${u}</span></div>
      <div style="color:#5B6474;font-size:${fs * 0.72}px;font-weight:550">${l}</div></div>`).join(`<div style="width:2px;align-self:stretch;background:#E5E8F0"></div>`);
  return `<div class="card row" style="background:#fff;border-radius:${fs * 1.1}px;padding:${fs * 0.9}px ${fs * 1.1}px;gap:${fs * 0.9}px">${cells}</div>`;
}

function shareCard(fs) {
  const t = (inner, label, hi) => `<div class="col" style="align-items:center;gap:${fs * 0.35}px;width:${fs * 3.6}px">
      <div class="box" style="width:${fs * 2.3}px;height:${fs * 2.3}px;border-radius:50%;${hi ? 'box-shadow:0 0 0 ' + fs * 0.16 + 'px #D0BCFF;' : ''}overflow:hidden">${inner}</div>
      <div style="color:${hi ? '#E6E0E9' : '#CAC4D0'};font-size:${fs * 0.55}px;text-align:center;line-height:1.2;font-weight:${hi ? 600 : 400}">${label}</div></div>`;
  const gen = (ic, bg) => `<div class="box" style="width:100%;height:100%;background:${bg}"><span class="ms" style="font-size:${fs * 1.1}px;color:#fff">${ic}</span></div>`;
  return `<div class="card" style="background:#2B2930;border-radius:${fs * 1.1}px;padding:${fs * 0.8}px ${fs * 0.7}px ${fs * 0.7}px">
    <div style="width:${fs * 1.6}px;height:4px;border-radius:4px;background:#938F99;margin:0 auto ${fs * 0.6}px"></div>
    <div style="color:#CAC4D0;font-size:${fs * 0.55}px;margin:0 0 ${fs * 0.25}px ${fs * 0.35}px">Sharing text</div>
    <div style="color:#E6E0E9;font-size:${fs * 0.68}px;margin:0 0 ${fs * 0.7}px ${fs * 0.35}px;max-width:${fs * 13}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">“Your order has been delayed due to…”</div>
    <div class="row" style="gap:${fs * 0.1}px">
      ${t(gen('sms', '#5E7CE2'), 'Messages')}${t(gen('mail', '#C2185B'), 'Email')}${t(gen('sticky_note_2', '#E0A800'), 'Notes')}
      ${t(`<img src="${LAUNCHER}" style="width:100%;height:100%">`, 'Nano Prompt<br>Ground', true)}
    </div></div>`;
}

// Places callouts on the device edges. out = how far (px) a callout reaches past the edge.
function decorate(sc, fs, dev, W, outL, outR) {
  const at = (item, html) => item.side === 'r'
    ? `<div style="position:absolute;right:${W - (dev.x + dev.w + outR)}px;top:${dev.y + item.y * dev.h}px;z-index:10">${html}</div>`
    : `<div style="position:absolute;left:${dev.x - outL}px;top:${dev.y + item.y * dev.h}px;z-index:10">${html}</div>`;
  let html = '';
  for (const c of sc.chips || []) html += at(c, chip(c, fs));
  if (sc.statsCard) html += at(sc.statsCard, statsCard(sc.statsCard, fs));
  if (sc.shareCard) html += at(sc.shareCard, shareCard(fs));
  return html;
}

// The icon motif: a translucent card tilted behind the device.
function backCard(box, tilt, dx, dy) {
  return `<div class="backcard" style="left:${box.x + dx}px;top:${box.y + dy}px;width:${box.w}px;height:${box.h}px;transform:rotate(${tilt}deg)"></div>`;
}

function device(sc, x, y, wDp, hDp, dp, bezel, radius, tilt = 0, camSize = 0) {
  const w = wDp * dp + bezel * 2, h = hDp * dp + bezel * 2;
  return {
    html: `<div class="device" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;padding:${bezel}px;border-radius:${radius}px;transform:rotate(${tilt}deg)">
      <div style="border-radius:${radius - bezel}px;overflow:hidden;position:relative">
        <div class="cam" style="top:${11 * dp}px;width:${camSize}px;height:${camSize}px"></div>
        ${appScreen(sc.app, wDp, hDp, dp)}</div></div>`,
    box: { x, y, w, h },
  };
}

function textBlock(sc, o) {
  const chips = o.chips ? `<div style="display:flex;flex-wrap:wrap;gap:${o.sub * 0.5}px;margin-top:${o.sub * 1.3}px">${o.chips.map(c => chip({ ...c, small: false }, o.sub * 0.8)).join('')}</div>` : '';
  return `<div style="position:absolute;left:${o.x}px;top:${o.y}px;width:${o.w}px;text-align:${o.align};${o.vcenter ? 'transform:translateY(-50%)' : ''}">
    <div class="tag" style="font-size:${o.tag}px"><img src="${ICON_ART}">${sc.tag}</div>
    <div class="title" style="font-size:${o.title}px;margin-top:${o.title * 0.3}px">${(o.wide && sc.titleWide) || sc.title}</div>
    <div class="sub" style="font-size:${o.sub}px;margin-top:${o.sub * 0.7}px;${o.align === 'center' ? 'padding:0 ' + o.sub * 0.8 + 'px' : ''}">${sc.sub}</div>${chips}</div>`;
}

// ------------------------------------------------------------------ layouts
function phoneFrame(sc, i) {
  const W = 1080, H = 1920, dp = 1.6, bezel = 14;
  const wDp = 412, hDp = 915;
  const dw = wDp * dp + bezel * 2;
  const tilt = sc.tilt ?? (i % 2 ? 3 : -3);
  const d = device(sc, (W - dw) / 2, 740, wDp, hDp, dp, bezel, 80, tilt, 13 * dp);
  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px;${vars(theme(i))}">
    ${textBlock(sc, { x: 60, y: 104, w: W - 120, align: 'center', tag: 30, title: 100, sub: 36 })}
    ${backCard(d.box, tilt + (i % 2 ? -9 : 9), i % 2 ? -60 : 60, -46)}
    ${d.html}${decorate(sc, 32, d.box, W, 120, 120)}</div>`;
}

function tabletFrame(sc, i, big) {
  const W = 1920, H = 1080;
  const [wDp, hDp, dp] = big ? [1280, 800, 0.86] : [960, 600, 1.15];
  const bezel = 24, dw = wDp * dp + bezel * 2, dh = hDp * dp + bezel * 2;
  const d = device(sc, W - dw + 40, (H - dh) / 2 + 70, wDp, hDp, dp, bezel, 48, -2, 10 * dp);
  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px;${vars(theme(i))}">
    ${textBlock(sc, { x: 100, y: H / 2, w: 640, align: 'left', tag: 24, title: 84, sub: 30, vcenter: true, wide: true, chips: sc.chips })}
    ${backCard(d.box, 6, 40, -60)}
    ${d.html}${decorate({ ...sc, chips: [], statsCard: sc.statsCard && { ...sc.statsCard, y: 0.6 }, shareCard: sc.shareCard && { side: 'l', y: 0.5 } }, 24, d.box, W, 90, 0)}</div>`;
}

function desktopFrame(sc, i) {
  const W = 1920, H = 1080, dp = 1.0, wDp = 540, hDp = 900, bar = 40;
  const ww = wDp * dp, wh = hDp * dp + bar;
  const x = 1130, y = (H - wh) / 2 + 40;
  const win = `<div class="win" style="left:${x}px;top:${y}px;width:${ww}px;height:${wh}px;border-radius:16px">
    <div class="bar" style="height:${bar}px;padding:0 14px;gap:10px;font-size:14px">
      <img src="${LAUNCHER}" style="width:20px;height:20px;border-radius:30%">Nano Prompt Ground<span style="flex:1"></span>
      ${['remove', 'crop_square', 'close'].map(n => `<span class="ms" style="font-size:18px;color:#CAC4D0;margin-left:14px">${n}</span>`).join('')}</div>
    ${appScreen({ ...sc.app }, wDp, hDp, dp, { noBars: true })}</div>`;
  const box = { x, y, w: ww, h: wh };
  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px;${vars(theme(i))}">
    ${textBlock(sc, { x: 110, y: H / 2, w: 720, align: 'left', tag: 24, title: 88, sub: 30, vcenter: true, wide: true })}
    ${backCard(box, 7, 50, -50)}
    ${win}${decorate({ ...sc, chips: (sc.chips || []).map(c => ({ ...c, y: Math.max(c.y, 0.08) })) }, 24, box, W, 150, 130)}</div>`;
}

function featureGraphic() {
  const W = 1024, H = 500, t = THEMES[0];
  const sc = SCENES[0];
  const dp = 0.86, bezel = 9, wDp = 412, hDp = 915;
  const d = device(sc, 640, 70, wDp, hDp, dp, bezel, 46, -8, 13 * dp);
  return `<div class="frame" style="left:0;width:${W}px;height:${H}px;${vars(t)}">
    <div class="bg" style="background:linear-gradient(120deg,${t.a},${t.b})"></div>
    <div class="blob" style="left:-120px;top:260px;width:420px;height:420px;background:${t.glow};opacity:.6"></div>
    <div class="blob" style="left:700px;top:-200px;width:420px;height:420px;background:#60A5FA;opacity:.55"></div>
    <div class="slab" style="left:560px;top:-60px;width:300px;height:260px;border-radius:60px;transform:rotate(-10deg)"></div>
    <div class="spark" style="left:576px;top:330px;width:70px;height:70px">${sparkSvg(.9)}</div>
    <div style="position:absolute;left:72px;top:50%;transform:translateY(-50%);width:540px">
      <div class="row" style="gap:18px"><img src="${LAUNCHER}" style="width:88px;height:88px;border-radius:26px;box-shadow:0 14px 34px rgba(8,20,40,.3)">
        <div class="title" style="font-size:40px;line-height:1.05">Nano Prompt<br>Ground</div></div>
      <div class="title" style="font-size:56px;margin-top:28px">Gemini Nano,<br><em>on your phone</em></div>
      <div class="sub" style="font-size:22px;margin-top:18px">Private, offline AI. No API key needed.</div>
    </div>
    ${backCard(d.box, -1, 40, -30)}
    ${d.html}</div>`;
}

// ------------------------------------------------------------------ build
const strip = document.getElementById('strip');
let W, H, frames = '';
if (MODE === 'feature') {
  W = 1024; H = 500; strip.style.width = W + 'px'; strip.style.height = H + 'px';
  strip.innerHTML = featureGraphic();
} else {
  const n = SCENES.length;
  if (MODE === 'phone') { W = 1080; H = 1920; SCENES.forEach((s, i) => frames += phoneFrame(s, i)); }
  if (MODE === 'tab7') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += tabletFrame(s, i, false)); }
  if (MODE === 'tab10') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += tabletFrame(s, i, true)); }
  if (MODE === 'desktop') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += desktopFrame(s, i)); }
  strip.style.width = W * n + 'px'; strip.style.height = H + 'px';
  strip.innerHTML = background(W, H, n) + frames;
}
window.FRAME = { W, H, n: MODE === 'feature' ? 1 : SCENES.length };
</script>
</body>
</html>
