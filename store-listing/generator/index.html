<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nano Prompt Ground store assets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
  :root {
    --ink: #16133D;
    --ink2: #4A4870;
    --brand1: #4F6BFF;
    --brand2: #8B5CF6;
    --brand3: #D16BD8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F5F6FF; font-family: 'Google Sans Flex', sans-serif; -webkit-font-smoothing: antialiased; }
  .ms { font-family: 'Material Symbols Rounded'; font-variation-settings: 'FILL' 1, 'wght' 500, 'opsz' 24; line-height: 1; display: inline-block; font-style: normal; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .box { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .shape { position: absolute; inset: 0; width: 100%; height: 100%; }
  .box > .ms { position: relative; }
  .app { position: relative; display: flex; flex-direction: column; overflow: hidden; font-family: 'Google Sans Flex', sans-serif; }
  .sb { display: flex; align-items: center; justify-content: space-between; color: #E6E0E9; flex-shrink: 0; position: relative; }
  .nav { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav i { display: block; background: #E6E0E9; border-radius: 99px; }
  .md p { margin-bottom: calc(var(--dp) * 12); }
  .md ul { padding-left: calc(var(--dp) * 22); margin-bottom: calc(var(--dp) * 12); }
  .md li { margin-bottom: calc(var(--dp) * 6); }
  .md strong { font-weight: 700; }
  .stats { display: flex; flex-wrap: wrap; }
  .caret { display: inline-block; vertical-align: text-bottom; margin-left: 2px; border-radius: 2px; }

  /* ------------------------------------------------ marketing canvas */
  #strip { position: relative; overflow: hidden; }
  .frame { position: absolute; top: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .spark { position: absolute; }
  .tag { display: inline-flex; align-items: center; gap: .4em; padding: .42em 1em; border-radius: 99px; background: #ffffffcc;
         border: 2px solid #DCE0FF; color: #4338CA; font-weight: 650; letter-spacing: .01em; }
  .title { color: var(--ink); font-weight: 820; letter-spacing: -0.035em; line-height: 1.0; }
  .title em { font-style: normal; background: linear-gradient(90deg, var(--brand1), var(--brand2) 55%, var(--brand3));
              -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
  .sub { color: var(--ink2); font-weight: 450; line-height: 1.3; letter-spacing: -0.005em; }
  .device { position: absolute; background: #0C0B11; box-shadow: 0 0 0 3px #34324A, 0 60px 120px -20px rgba(40, 30, 120, .45), 0 20px 40px rgba(40, 30, 120, .2); }
  .device .cam { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; background: #000; z-index: 3; box-shadow: inset 0 0 0 2px #1d1c28; }
  .chip { position: relative; display: inline-flex; align-items: center; background: #fff; color: var(--ink); font-weight: 650; white-space: nowrap;
          box-shadow: 0 24px 60px -10px rgba(48, 40, 140, .28), 0 4px 12px rgba(48, 40, 140, .08); z-index: 10; letter-spacing: -0.01em; }
  .chip .ic { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff;
              background: linear-gradient(135deg, var(--brand1), var(--brand2)); flex-shrink: 0; }
  .card { position: relative; z-index: 10; box-shadow: 0 30px 80px -10px rgba(30, 20, 90, .45); }
  .win { position: absolute; background: #1D1B22; box-shadow: 0 0 0 1px #3a3846, 0 60px 120px -20px rgba(40, 30, 120, .45); overflow: hidden; }
  .win .bar { display: flex; align-items: center; background: #26242C; color: #E6E0E9; }
</style>
</head>
<body>
<div id="strip"></div>
<script src="ui.js"></script>
<script src="scenes.js"></script>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'phone';
const LAUNCHER = '../../app/src/main/ic_launcher-playstore.png';
const PLAY_ICON = '../../fastlane/metadata/android/en-US/images/icon.png';

const sparkSvg = (id, opacity = 1) => `<svg viewBox="0 0 100 100" width="100%" height="100%" style="opacity:${opacity}">
  <defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6CFF"/><stop offset=".6" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D16BD8"/></linearGradient></defs>
  <path d="${SHAPES.sparkle4}" fill="url(#g${id})"/></svg>`;

// Continuous background across all frames, so the set reads as one panorama in the store.
function background(W, H, n) {
  const total = W * n;
  let html = `<div class="bg" style="width:${total}px;height:${H}px;background:linear-gradient(180deg,#F7F8FF 0%,#ECEEFF 100%)">`;
  const blobs = ['#B9C4FF', '#D6C6FF', '#FBD3F1', '#AFCBFF', '#C9B8FF'];
  const big = Math.max(W, H);
  for (let i = 0; i < n * 2 + 1; i++) {
    const x = (i / 2) * W - big * 0.25 + (i % 3) * W * 0.08;
    const y = (i % 2 ? 0.62 : 0.1) * H;
    html += `<div class="blob" style="left:${x}px;top:${y}px;width:${big * 0.5}px;height:${big * 0.5}px;background:${blobs[i % blobs.length]};opacity:.75"></div>`;
  }
  // sparkles straddling the seams between frames (kept clear of the copy)
  const wide = W > H;
  for (let i = 1; i < n; i++) {
    const s = (wide ? 0.2 : (i % 2 ? 0.17 : 0.11)) * Math.min(W, H);
    const y = (wide ? 0.88 : (i % 2 ? 0.78 : 0.42)) * H - s / 2;
    html += `<div class="spark" style="left:${i * W - s / 2}px;top:${y}px;width:${s}px;height:${s}px">${sparkSvg('s' + i, .9)}</div>`;
    const s2 = s * 0.35;
    const x2 = wide ? i * W - s / 2 - s2 * 0.4 : i * W - s / 2 + s * 0.9;
    html += `<div class="spark" style="left:${x2}px;top:${y - s2 * 0.6}px;width:${s2}px;height:${s2}px">${sparkSvg('t' + i, .55)}</div>`;
  }
  return html + '</div>';
}

function chip(c, fs) {
  const f = c.small ? fs * 0.86 : fs;
  return `<div class="chip" style="font-size:${f}px;gap:${f * 0.5}px;padding:${f * 0.42}px ${f * 0.85}px ${f * 0.42}px ${f * 0.42}px;border-radius:${f * 2}px">
    <span class="ic" style="width:${f * 1.7}px;height:${f * 1.7}px"><span class="ms" style="font-size:${f}px">${c.icon}</span></span>${c.text}</div>`;
}

function statsCard(sc, fs) {
  const cells = sc.values.map(([v, u, l]) => `<div class="col" style="align-items:flex-start;gap:${fs * 0.2}px">
      <div style="color:#D0BCFF;font-size:${fs * 1.9}px;font-weight:750;letter-spacing:-0.03em;line-height:1">${v}<span style="font-size:${fs * 0.9}px;font-weight:600;margin-left:4px">${u}</span></div>
      <div style="color:#CAC4D0;font-size:${fs * 0.72}px;font-weight:500">${l}</div></div>`).join(`<div style="width:2px;align-self:stretch;background:#3a3846"></div>`);
  return `<div class="card row" style="background:#211F26;border-radius:${fs * 1.2}px;padding:${fs * 0.9}px ${fs * 1.1}px;gap:${fs * 0.9}px;border:2px solid #4a4458">${cells}</div>`;
}

function shareCard(fs) {
  const t = (inner, label, hi) => `<div class="col" style="align-items:center;gap:${fs * 0.35}px;width:${fs * 3.6}px">
      <div class="box" style="width:${fs * 2.3}px;height:${fs * 2.3}px;border-radius:50%;${hi ? 'box-shadow:0 0 0 ' + fs * 0.16 + 'px #D0BCFF;' : ''}overflow:hidden">${inner}</div>
      <div style="color:${hi ? '#E6E0E9' : '#CAC4D0'};font-size:${fs * 0.55}px;text-align:center;line-height:1.2;font-weight:${hi ? 600 : 400}">${label}</div></div>`;
  const gen = (ic, bg) => `<div class="box" style="width:100%;height:100%;background:${bg}"><span class="ms" style="font-size:${fs * 1.1}px;color:#fff">${ic}</span></div>`;
  return `<div class="card" style="background:#2B2930;border-radius:${fs * 1.1}px;padding:${fs * 0.8}px ${fs * 0.7}px ${fs * 0.7}px">
    <div style="width:${fs * 1.6}px;height:4px;border-radius:4px;background:#938F99;margin:0 auto ${fs * 0.6}px"></div>
    <div style="color:#CAC4D0;font-size:${fs * 0.55}px;margin:0 0 ${fs * 0.25}px ${fs * 0.35}px">Sharing text</div>
    <div style="color:#E6E0E9;font-size:${fs * 0.68}px;margin:0 0 ${fs * 0.7}px ${fs * 0.35}px;max-width:${fs * 13}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">“Your order has been delayed due to…”</div>
    <div class="row" style="gap:${fs * 0.1}px">
      ${t(gen('sms', '#5E7CE2'), 'Messages')}${t(gen('mail', '#C2185B'), 'Email')}${t(gen('sticky_note_2', '#E0A800'), 'Notes')}
      ${t(`<img src="${LAUNCHER}" style="width:100%;height:100%">`, 'Nano Prompt<br>Ground', true)}
    </div></div>`;
}

// Places callouts on the device edges. out = how far (px) a callout reaches past the edge.
function decorate(sc, fs, dev, W, outL, outR) {
  const at = (item, html) => item.side === 'r'
    ? `<div style="position:absolute;right:${W - (dev.x + dev.w + outR)}px;top:${dev.y + item.y * dev.h}px;z-index:10">${html}</div>`
    : `<div style="position:absolute;left:${dev.x - outL}px;top:${dev.y + item.y * dev.h}px;z-index:10">${html}</div>`;
  let html = '';
  for (const c of sc.chips || []) html += at(c, chip(c, fs));
  if (sc.statsCard) html += at(sc.statsCard, statsCard(sc.statsCard, fs));
  if (sc.shareCard) html += at(sc.shareCard, shareCard(fs));
  return html;
}

function device(sc, x, y, wDp, hDp, dp, bezel, radius, tilt = 0, camSize = 0) {
  const w = wDp * dp + bezel * 2, h = hDp * dp + bezel * 2;
  return {
    html: `<div class="device" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;padding:${bezel}px;border-radius:${radius}px;transform:rotate(${tilt}deg)">
      <div style="border-radius:${radius - bezel}px;overflow:hidden;position:relative">
        <div class="cam" style="top:${11 * dp}px;width:${camSize}px;height:${camSize}px"></div>
        ${appScreen(sc.app, wDp, hDp, dp)}</div></div>`,
    box: { x, y, w, h },
  };
}

function textBlock(sc, o) {
  const chips = o.chips ? `<div style="display:flex;flex-wrap:wrap;gap:${o.sub * 0.5}px;margin-top:${o.sub * 1.3}px">${o.chips.map(c => chip({ ...c, small: false }, o.sub * 0.8)).join('')}</div>` : '';
  return `<div style="position:absolute;left:${o.x}px;top:${o.y}px;width:${o.w}px;text-align:${o.align};${o.vcenter ? 'transform:translateY(-50%)' : ''}">
    <div class="tag" style="font-size:${o.tag}px"><span class="ms" style="font-size:${o.tag * 1.05}px;color:#6366F1">auto_awesome</span>${sc.tag}</div>
    <div class="title" style="font-size:${o.title}px;margin-top:${o.title * 0.32}px">${(o.wide && sc.titleWide) || sc.title}</div>
    <div class="sub" style="font-size:${o.sub}px;margin-top:${o.sub * 0.75}px;${o.align === 'center' ? 'padding:0 ' + o.sub * 1.2 + 'px' : ''}">${sc.sub}</div>${chips}</div>`;
}

// ------------------------------------------------------------------ layouts
function phoneFrame(sc, i) {
  const W = 1080, H = 1920, dp = 1.48, bezel = 14;
  const wDp = 412, hDp = 915;
  const dw = wDp * dp + bezel * 2;
  const d = device(sc, (W - dw) / 2, 552, wDp, hDp, dp, bezel, 76, sc.tilt || 0, 13 * dp);
  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px">
    ${textBlock(sc, { x: 70, y: 96, w: W - 140, align: 'center', tag: 30, title: 102, sub: 36 })}
    ${d.html}${decorate(sc, 30, d.box, W, 140, 140)}</div>`;
}

function tabletFrame(sc, i, big) {
  const W = 1920, H = 1080;
  const [wDp, hDp, dp] = big ? [1280, 800, 0.82] : [960, 600, 1.05];
  const bezel = 24, dw = wDp * dp + bezel * 2, dh = hDp * dp + bezel * 2;
  const d = device(sc, W - dw - 70, (H - dh) / 2 + 20, wDp, hDp, dp, bezel, 44, 0, 10 * dp);

  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px">
    ${textBlock(sc, { x: 100, y: H / 2, w: 600, align: 'left', tag: 24, title: 78, sub: 29, vcenter: true, wide: true, chips: sc.chips })}
    ${d.html}${decorate({ ...sc, chips: [], statsCard: sc.statsCard && { ...sc.statsCard, y: 0.6 }, shareCard: sc.shareCard && { side: 'l', y: 0.5 } }, 24, d.box, W, 90, 0)}</div>`;
}

function desktopFrame(sc, i) {
  const W = 1920, H = 1080, dp = 1.0, wDp = 520, hDp = 860, bar = 40;
  const ww = wDp * dp, wh = hDp * dp + bar;
  const x = 1160, y = (H - wh) / 2;
  const win = `<div class="win" style="left:${x}px;top:${y}px;width:${ww}px;height:${wh}px;border-radius:14px">
    <div class="bar" style="height:${bar}px;padding:0 14px;gap:10px;font-size:14px">
      <img src="${LAUNCHER}" style="width:20px;height:20px;border-radius:50%">Nano Prompt Ground<span style="flex:1"></span>
      ${['remove', 'crop_square', 'close'].map(n => `<span class="ms" style="font-size:18px;color:#CAC4D0;margin-left:14px">${n}</span>`).join('')}</div>
    ${appScreen({ ...sc.app }, wDp, hDp, dp, { noBars: true })}</div>`;
  const box = { x, y, w: ww, h: wh };

  return `<div class="frame" style="left:${i * W}px;width:${W}px;height:${H}px">
    ${textBlock(sc, { x: 110, y: H / 2, w: 700, align: 'left', tag: 24, title: 84, sub: 30, vcenter: true, wide: true })}
    ${win}${decorate({ ...sc, chips: (sc.chips || []).map(c => ({ ...c, y: Math.max(c.y, 0.08) })) }, 24, box, W, 150, 130)}</div>`;
}

function featureGraphic() {
  const W = 1024, H = 500;
  const sc = SCENES[0];
  const dp = 0.82, bezel = 9, wDp = 412, hDp = 915;
  const d = device(sc, 640, 60, wDp, hDp, dp, bezel, 44, -8, 13 * dp);
  return `<div class="frame" style="left:0;width:${W}px;height:${H}px">
    ${background(W, H, 1)}
    <div class="spark" style="left:520px;top:300px;width:120px;height:120px">${sparkSvg('f1', .9)}</div>
    <div class="spark" style="left:600px;top:40px;width:46px;height:46px">${sparkSvg('f2', .6)}</div>
    <div style="position:absolute;left:72px;top:50%;transform:translateY(-50%);width:520px">
      <div class="row" style="gap:18px"><img src="${PLAY_ICON}" style="width:84px;height:84px;border-radius:22px;box-shadow:0 12px 30px rgba(48,40,140,.25)">
        <div class="title" style="font-size:44px;line-height:1.05">Nano Prompt<br>Ground</div></div>
      <div class="title" style="font-size:50px;margin-top:30px;line-height:1.05">Gemini Nano,<br><em>on your phone</em></div>
      <div class="sub" style="font-size:22px;margin-top:16px">Private, offline AI. No API key needed.</div>
    </div>
    ${d.html}</div>`;
}

// ------------------------------------------------------------------ build
const strip = document.getElementById('strip');
let W, H, frames = '';
if (MODE === 'feature') {
  W = 1024; H = 500; strip.style.width = W + 'px'; strip.style.height = H + 'px';
  strip.innerHTML = featureGraphic();
} else {
  const n = SCENES.length;
  if (MODE === 'phone') { W = 1080; H = 1920; SCENES.forEach((s, i) => frames += phoneFrame(s, i)); }
  if (MODE === 'tab7') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += tabletFrame(s, i, false)); }
  if (MODE === 'tab10') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += tabletFrame(s, i, true)); }
  if (MODE === 'desktop') { W = 1920; H = 1080; SCENES.forEach((s, i) => frames += desktopFrame(s, i)); }
  strip.style.width = W * n + 'px'; strip.style.height = H + 'px';
  strip.innerHTML = background(W, H, n) + frames;
}
window.FRAME = { W, H, n: MODE === 'feature' ? 1 : SCENES.length };
</script>
</body>
</html>
